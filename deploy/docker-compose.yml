# GridPulse local stack. Start with: powershell -ExecutionPolicy Bypass -File scripts/make.ps1 up
# (runs: docker compose --env-file .env -f deploy/docker-compose.yml up -d --build --wait)
name: gridpulse

x-gridpulse-db-url: &gridpulse-db-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

x-airflow: &airflow
  build:
    context: ..
    dockerfile: deploy/Dockerfile.airflow
  image: gridpulse-airflow:0.1.0
  env_file: ../.env
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    GRIDPULSE_DB_URL: *gridpulse-db-url
    GRIDPULSE_CONFIG_DIR: /opt/gridpulse/config
    GRIDPULSE_DATA_DIR: /opt/gridpulse/data
    GRIDPULSE_PYTHON: /opt/gridpulse-venv/bin/python
  volumes:
    - ../dags:/opt/airflow/dags
    - ../src:/opt/gridpulse/src
    - ../config:/opt/gridpulse/config:ro
    - ../data:/opt/gridpulse/data
    - airflow-logs:/opt/airflow/logs

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.app
  image: gridpulse-app:0.1.0
  env_file: ../.env

services:
  postgres:
    image: postgres:16.6
    env_file: ../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/create-airflow-db.sh:/docker-entrypoint-initdb.d/10-create-airflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gridpulse-init:
    <<: *app
    command: ["python", "-m", "gridpulse.publish.init_db"]
    environment:
      GRIDPULSE_DB_URL: *gridpulse-db-url
      GRIDPULSE_SQL_DIR: /opt/gridpulse/db/init
      GRIDPULSE_DATA_DIR: /opt/gridpulse/data
    volumes:
      - ../db/init:/opt/gridpulse/db/init:ro
      - ../data:/opt/gridpulse/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users list -o plain | grep -qw "$${AIRFLOW_ADMIN_USER}" ||
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname Grid --lastname Pulse --role Admin --email admin@example.invalid)
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  streamlit:
    <<: *app
    environment:
      GRIDPULSE_DB_URL: *gridpulse-db-url
      GRIDPULSE_CONFIG_DIR: /opt/gridpulse/config
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ../app:/opt/gridpulse/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      gridpulse-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  airflow-logs:
