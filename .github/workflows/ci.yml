name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Unit tests
        run: pytest -q
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config -q
