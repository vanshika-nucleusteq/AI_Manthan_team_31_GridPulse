[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse"
version = "0.1.0"
description = "GridPulse: smart meter telemetry batch platform (AI Manthan Track B, team 31)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=16",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24.8"]
app = ["streamlit==1.45.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
markers = ["integration: needs the Docker stack; run locally, not in CI"]
