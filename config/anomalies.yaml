# config/anomalies.yaml (docs/gridpulse-plan.md section 5)
# min_ratio_to_mean: also require kWh >= ratio x baseline mean (DEF-08: night hours with a tiny
# baseline sd gave 580 false positives; at 2.0 the 21-day answer key keeps 10/10 spikes, 0 FPs).
spike:   {z_threshold: 4.0, baseline_days: 28, min_samples: 14, min_ratio_to_mean: 2.0}
tamper:  {zero_hours: 48, min_completeness_pct: 90, feeder_normal_share: 0.8}
outage:  {feeder_missing_share: 0.5, min_consecutive_intervals: 2}
# Each run re-detects events whose window starts in [first lookback day - scan_context_days, ds],
# so a tamper run that began before the lookback window is still found and extended.
scan_context_days: 3
