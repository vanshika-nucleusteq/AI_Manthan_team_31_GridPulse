# Pipeline settings. Values come from docs/gridpulse-plan.md sections 1-5 and P8.
timezone_storage: UTC
timezone_local: Asia/Kolkata
go_live_date: "2026-08-01"       # no window reaches before this IST day (no meters reported earlier)
interval_minutes: 15
intervals_per_day: 96
paths:                     # under data_dir; GRIDPULSE_DATA_DIR overrides data_dir
  data_dir: data
  landing: landing
  lake: lake
  answer_key: answer_key.json
  meter_master: meter_master.csv
retention:
  raw_days: 30
  bronze_days: 30
  quarantine_days: 30
  silver_months: 13
  hourly_months: 13
  archive_days: 7
compaction:
  target_file_mb_min: 64
  target_file_mb_max: 128
  sort_by: [meter_id, interval_start]
orchestration:
  dag_id: gridpulse_daily
  # Daily at 00:00 UTC (05:30 IST; Airflow's ds is then the IST day). The DAG stays PAUSED
  # (DAGS_ARE_PAUSED_AT_CREATION) because the demo data is dated Aug 2026: run it with
  # make.ps1 run-day / backfill, which work on a paused DAG. A schedule is required for that:
  # with null, backfill finds no run dates (DEF-12). If unpaused by mistake, ingest fails on a
  # day with no landing data before anything is overwritten (DEF-10).
  schedule: "0 0 * * *"
  retries: 2
  retry_delay_minutes: 1
  max_active_runs: 1
